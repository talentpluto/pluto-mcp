interface:
  display_name: "Pluto candidate scoring"
  short_description: "Score candidates against Team DNA, a JD, or a rubric"
  default_prompt: "Use $score-candidate to score the explicitly identified candidates against the requested Team DNA, job description, or saved rubric; use only a server-approved rubric scoring projection, return no rubric score when it is absent, and permit zero only for an approved exclusion backed by a grounded exact source excerpt."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
