interface:
  display_name: "Pluto candidate scoring"
  short_description: "Score candidates against Team DNA, a JD, or a rubric"
  default_prompt: "Use $score-candidate to score the explicitly identified candidates against the requested Team DNA, job description, or saved rubric; omit protected-trait free-form profile exclusions before evaluating evidence, keep legitimate job and company exclusions enforceable, cite explicit evidence, disclose coverage and unknowns, and keep every score separate and non-decisional."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
