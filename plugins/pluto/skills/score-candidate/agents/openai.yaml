interface:
  display_name: "Pluto candidate scoring"
  short_description: "Score candidates against Team DNA, a JD, or a rubric"
  default_prompt: "Use $score-candidate to assess the explicitly identified candidates against the requested Team DNA, job description, or saved rubric; reuse completed small_lookup, medium_lookup, or heavy_lookup operations when they cover the selected profiles, otherwise default new scoring-only profile work to heavy_lookup at exactly five shared organization candidate credits per newly admitted profile, state the maximum charge before starting without asking a redundant tier question, score at most 10 profiles from one completed lookup through one get_rubrics call and poll the scoring operation it returns, route larger or multi-source work through one score_rubric_candidates operation for up to 200 profiles, poll its unchanged operationId, preserve requested order and per-candidate failures, and present the server-authoritative Luna scouting assessment exactly as returned. New rubric-v3-scouting.1 results use the complete supplied work history and return a holistic score with separate confidence, criterion narratives, sources, and critical unknowns. Verification is not run; do not invent criterion scores, coverage, passed prerequisites, or eligibility. Null criterion scores do not erase an available scouting score. Scouting does not authorize automatic promotion or a hiring decision. Preserve historical evidence-aware-v2 semantics for older results. Keep processing failures as No score; do not recompute or rank saved-rubric results."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
