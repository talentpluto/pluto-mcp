interface:
  display_name: "Pluto candidate scoring"
  short_description: "Score candidates against Team DNA, a JD, or a rubric"
  default_prompt: "Use $score-candidate to assess the explicitly identified candidates against the requested Team DNA, job description, or saved rubric; reuse completed small_lookup, medium_lookup, or heavy_lookup operations when they cover the selected profiles, otherwise default new scoring-only profile work to heavy_lookup at exactly five shared organization candidate credits per newly admitted profile, state the maximum charge before starting without asking a redundant tier question, keep at most 10 profiles from one completed lookup on compatible inline get_rubrics scoring, route larger or multi-source work through one score_rubric_candidates operation for up to 200 profiles, poll its unchanged operationId, preserve requested order and per-candidate failures, and present the server-authoritative evidence-aware assessment exactly as returned, including separate overall comparison, observed alignment, coverage, and unknowns; do not recompute or rank saved-rubric results. A partial grounded assessment may have a score without authorizing automation. When all criteria are unknown, report no overall score or observed score."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
