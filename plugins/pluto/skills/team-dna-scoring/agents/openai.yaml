interface:
  display_name: "Pluto Team DNA scoring"
  short_description: "Assess selected candidates against the client's Team DNA"
  default_prompt: "Use $team-dna-scoring to assess the explicitly identified candidates against the authenticated client's stored Team DNA. Compare explicit candidate facts with the returned team, founder, recent-joiner, and hiring-preference signals, and present a labeled, evidence-cited alignment readout — overlap, no observed overlap, or unknown per dimension — as descriptive familiarity and complementarity context, never a numeric fit score, culture-fit judgment, protected-trait proxy, ranking, or qualification evidence."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
