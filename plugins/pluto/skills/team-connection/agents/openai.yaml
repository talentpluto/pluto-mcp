interface:
  display_name: "Pluto team connection"
  short_description: "Find team members with shared history with one candidate"
  default_prompt: "Use $team-connection to find which of the client's team members share concrete professional history with the one candidate LinkedIn profile URL the user explicitly supplied. Present at most three returned members with their specific overlap facts as warm-introduction and outreach-personalization context, never as culture fit, a protected-trait proxy, qualification evidence, or a roster listing."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
