interface:
  display_name: "Pluto market snapshot"
  short_description: "Read privacy-thresholded US talent-market signals"
  default_prompt: "Use $market-snapshot to get a directional US talent-market snapshot for one broad role family. Keep candidate-reported expectations separate from client-entered role ranges, preserve unavailable privacy-thresholded metrics, and do not infer cohort sizes or individual outcomes."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
