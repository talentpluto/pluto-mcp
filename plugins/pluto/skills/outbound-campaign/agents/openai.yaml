interface:
  display_name: "Pluto outbound campaigns"
  short_description: "Draft, review, and create candidate email campaigns"
  default_prompt: "Use $outbound-campaign to turn my selected out-of-network candidates into a complete, editable email sequence. Show the audience, role, timing, subject, and every message in one compact preview, preserve every candidate handle, and create only the exact latest campaign I explicitly authorize."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
