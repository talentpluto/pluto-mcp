interface:
  display_name: "Pluto outbound campaigns"
  short_description: "Create, review, or cancel an outbound email campaign"
  default_prompt: "Use $outbound-campaign to create a campaign for my selected candidates regardless of network status. Load my campaign setup first, reuse completed email-enrichment results, and run one private enrichment batch only for recipients still missing them. If I have not chosen the content source, ask once whether to use one of my named saved templates or create custom content; custom can be copy or instructions I provide, or copy Pluto drafts from known context. If I clearly ask to create, make, start, launch, or send the campaign, preserve that intent through preparation, required clarifications, user-authorized audience corrections, template loading, and edits within the same request; do not ask me to confirm it again merely because I have not seen every setting or line of copy. Once the campaign is fully defined, show me a compact creation summary and call the creation tool in the same response. Ask whether to create only when my creation intent is genuinely unclear. When a required material detail is unresolved, ask one focused material-choice question rather than another creation confirmation, then continue under my existing creation intent after I answer. For a draft-only or review-only request, show one complete editable review and stop without a launch question. Keep opaque identifiers and recipient-policy outcomes private, never ask me to revise the audience because downstream recipient-policy handling privately retains a subset or zero recipients, and follow a queued creation privately until it completes or fails. If I instead ask to cancel or stop an existing campaign, list my cancellable campaigns with their names, statuses, and recipient counts, explain that cancelling permanently stops the remaining scheduled emails without recalling anything already sent, and cancel only the one exact campaign I explicitly confirm."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
