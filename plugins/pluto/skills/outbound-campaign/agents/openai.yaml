interface:
  display_name: "Pluto outbound campaigns"
  short_description: "Create, review, or cancel an outbound email campaign"
  default_prompt: "Use $outbound-campaign to create a campaign for my selected candidates regardless of network status. Load my campaign setup first, reuse completed email-enrichment results, and run one private enrichment batch only for recipients still missing them. If I have not chosen the content source, ask once whether to use one of my named saved templates or create custom content; custom can be copy or instructions I provide, or copy Pluto drafts from known context. Then show one complete editable review containing every setting, the full representative email sequence, exact generation instructions, and every selected candidate. Keep opaque identifiers and recipient-policy outcomes private, never ask me to revise the audience because downstream recipient-policy handling privately retains a subset or zero recipients, call the creation tool only after I explicitly confirm that exact latest review, and follow a queued creation privately until it completes or fails. If I instead ask to cancel or stop an existing campaign, list my cancellable campaigns with their names, statuses, and recipient counts, explain that cancelling permanently stops the remaining scheduled emails without recalling anything already sent, and cancel only the one exact campaign I explicitly confirm."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
