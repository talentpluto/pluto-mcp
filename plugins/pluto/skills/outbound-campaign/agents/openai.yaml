interface:
  display_name: "Pluto outbound campaigns"
  short_description: "Create a campaign with an editable email sequence"
  default_prompt: "Use $outbound-campaign to create a campaign for my selected out-of-network candidates. Prefill one compact basics proposal with the campaign name, role, audience, cadence, and available delivery choice. Then let me choose whether to supply exact shared copy, supply recipient-specific generation instructions, or have Pluto draft exact shared copy for me. Show the complete sequence together, let me edit it naturally, and finish with a concise review of the copy, settings, route behavior, and every selected candidate. Keep opaque identifiers private, call the creation tool only after I explicitly confirm that exact latest review, and follow a queued creation privately to its completed or failed message."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
