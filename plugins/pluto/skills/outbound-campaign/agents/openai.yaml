interface:
  display_name: "Pluto outbound campaigns"
  short_description: "Draft, review, and create candidate email campaigns"
  default_prompt: "Use $outbound-campaign to turn my selected out-of-network candidates into one concise, editable email sequence. Show a compact campaign preview, preserve every candidate handle, and create the reviewed campaign only after I explicitly authorize it."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
