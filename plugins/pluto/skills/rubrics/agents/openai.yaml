  short_description: "Create or update complete candidate rubrics"
  default_prompt: "Use $rubrics to draft or edit one complete candidate rubric, including every preferred and avoided company with its high, medium, or low priority, show the full proposed contents for review, and save only after I confirm the exact proposal."

