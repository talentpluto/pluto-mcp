interface:
  display_name: "Pluto connection recovery"
  short_description: "Diagnose missing Pluto tools and start required sign-in"
  default_prompt: "Use $connection-recovery to inspect missing Pluto tools and current startup errors, run codex mcp login pluto immediately for a confirmed Codex authentication failure, and resume my original task after recovery."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
