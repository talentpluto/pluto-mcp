interface:
  display_name: "Pluto candidate discovery"
  short_description: "Draft and present server-ranked candidate searches"
  default_prompt: "Use $candidate-discovery to turn my recruiting prompt into a compact LinkedIn-style candidate profile and a structured search brief. Keep required, preferred, and excluded criteria distinct; omit empty or redundant sections; and clearly label suggested preferences. Iterate with me without calling the search tool. Only after I approve the current draft and explicitly ask to search, make one call with the approved execution source—a structured Search brief for a direct search, or the unchanged recognizable raw JD unless I changed the target and approved switching to a direct brief—plus a fresh request ID and candidate_pool result mode. Validate the returned talentpluto.candidate-search-experience.v1 response, preserve every server-ranked lane and candidate in order without client-side reranking or another cutoff, use requestFit as authoritative evidence, keep expandedSuggestions separate, and include every verificationCandidates question."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
