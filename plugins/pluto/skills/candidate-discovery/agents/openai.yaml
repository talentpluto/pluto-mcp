interface:
  display_name: "Pluto candidate discovery"
  short_description: "Run durable, personalized Pluto candidate searches"
  default_prompt: "Use $candidate-discovery to run my clear recruiting query immediately. Send the complete request with a fresh request ID, candidate_pool result mode, the user's explicit targetCount when provided, and a faithful alternateExternalSearchQuery when the direct request can be safely restated without changing it. Automatically run the short MCP call loops: poll get_candidate_search until each durable job completes, follow every persisted pageInfo.nextCursor, and, only when my explicit numeric target remains unmet and iteration.canContinue is true, start a continuation job with the prior searchId and a fresh request ID. Stop at the requested total or a documented source, safety, failure, or no-progress boundary. Call get_client_team_dna alongside polling for the relevant department, preserve every qualification lane and matchStatus, then personalize ranking only within each lane from evidence-backed Team DNA and candidate facts."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
