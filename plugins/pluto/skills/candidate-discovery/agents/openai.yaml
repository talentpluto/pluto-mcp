interface:
  display_name: "Pluto candidate discovery"
  short_description: "Run durable, personalized Pluto candidate searches"
  default_prompt: "Use $candidate-discovery to run my clear recruiting query immediately. Send the complete request with a fresh request ID, candidate_pool result mode, the user's explicit targetCount when provided, and a faithful alternateExternalSearchQuery when the direct request can be safely restated without changing it. Automatically run the short MCP call loops: poll get_operation_status until each durable job completes, follow every persisted pageInfo.nextCursor, and, only when my explicit numeric target remains unmet and iteration.canContinue is true, start a continuation job with the prior searchId and a fresh request ID. Stop at the requested total or a documented source, safety, failure, or no-progress boundary. When get_client_team_dna is available, call it alongside polling for the relevant department. Do not call find_team_connection during the search; present the roster without per-candidate team-connection annotations. Present candidate_pool profiles in server order as source-ranked leads, but for a small-volume request present only the user's requested number. Compare the request only with explicit returned candidate facts, and use Team DNA for bounded client-specific explanations without claiming factual qualification."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
