interface:
  display_name: "Pluto candidate discovery"
  short_description: "Draft an ideal profile, then find candidates"
  default_prompt: "Use $candidate-discovery to turn my recruiting prompt into a hypothetical ideal LinkedIn profile and exact draft search brief. Iterate with me without calling the search tool. Only after I approve the current draft and explicitly ask to search, make one call with a fresh request ID and return one concise evidence-first shortlist."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
