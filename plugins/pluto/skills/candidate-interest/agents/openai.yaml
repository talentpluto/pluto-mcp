interface:
  display_name: "Pluto candidate interest"
  short_description: "Act on one candidate or enrich work emails"
  default_prompt: "Use $candidate-interest for candidates I selected from Pluto or LinkedIn profile URLs I directly supplied. Keep an in-network express-interest action separate from a one-to-500-item work-email batch of any network status, prefer the private async start-and-poll flow, preserve every handle pair or direct URL and input order, keep request IDs and job IDs private, return each committed work email with its separate verification outcome, and retain each fresh successful handle privately for an allowed out-of-network campaign."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
