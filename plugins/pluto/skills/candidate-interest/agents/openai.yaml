interface:
  display_name: "Pluto candidate interest"
  short_description: "Act on one candidate or enrich contact emails"
  default_prompt: "Use $candidate-interest for candidates I selected from Pluto or LinkedIn profile URLs I directly supplied. Keep an in-network express-interest action separate from a one-to-500-item email-enrichment batch of any network status, prefer the private async start-and-poll flow, preserve every handle pair or direct URL and input order, keep request IDs and operation IDs private, return every result in a table with LinkedIn URL, name, email, email type, provider status, and verification outcome, provide a complete matching CSV export, and retain each fresh successful handle privately for an allowed out-of-network campaign."

dependencies:
  tools:
    - type: "mcp"
      value: "pluto"
      description: "Pluto's authenticated TalentPluto recruiting MCP server"
      transport: "streamable_http"
      url: "https://app.talentpluto.com/api/mcp"
